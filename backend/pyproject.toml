[project]
name = "locats-backend"
version = "0.1.0"
description = "LocaTS - Intelligent Hazard Identification & Optimized Relocation Planning"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "numpy>=1.24.0",
    "geopandas>=0.14.0",
    "networkx>=3.2",
    "ortools>=9.8",
    "shapely>=2.0.0",
    "httpx>=0.25.0",
    "python-dateutil>=2.8.0",
    "structlog>=23.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.1.0",
]
